<html lang="en" translate="no" class="dark" data-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="utf-8" />

         re-parent React-managed DOM nodes, which makes later renders fail with
         "Failed to execute 'insertBefore' on 'Node'". -->
    <meta name="google" content="notranslate" />
    <title>Teldrive</title>
    <meta key="title" content="Teldrive" property="og:title" />
    <meta content="Teldrive cloud storage." property="og:description" />
    <meta content="Teldrive cloud storage." name="description" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <meta name="theme-color" content="#1a1a1a" />
  </head>
  <body class="antialiased bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
