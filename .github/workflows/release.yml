name: build-windows-bundle

# 在 GitHub 的 Windows runner 上从源码编译并打包一键运行包。
# 产物里 config.toml 用占位符密钥，用户首次启动时自动生成自己的随机密钥，
# 因此这个公开包不含任何人的真实 signing-key / data-key。
#
# 触发方式：
#   * push 一个 v* tag  -> 构建 + 创建 Release 并附上 zip
#   * Actions 页面手动运行 -> 只构建，产物在 Artifacts 里

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      BUN_INSTALL: "${{ github.workspace }}/.bun"
      PG_VERSION: "17.11.0"
      BUNDLE: "dist/teldrive-2-win64"
      ZIP: "dist/teldrive-2-win64.zip"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/teldrive-2/go.mod
          cache-dependency-path: src/teldrive-2/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build UI
        working-directory: src/teldrive-2/ui
        run: |
          bun install --frozen-lockfile --no-progress
          bun run build

      - name: Build teldrive.exe (embeds ui/dist)
        working-directory: src/teldrive-2
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE $env:BUNDLE) | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE "$env:BUNDLE/teldrive.exe"
          $env:CGO_ENABLED = '0'
          go version
          go build -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$env:GITHUB_SHA -X main.date=$date" -o $out ./cmd/teldrive
          & $out version

      - name: Fetch portable PostgreSQL (windows x86_64)
        shell: pwsh
        run: |
          $jar = "embedded-postgres-binaries-windows-amd64-$env:PG_VERSION.jar"
          $url = "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-windows-amd64/$env:PG_VERSION/$jar"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/pg.jar"
          Copy-Item "$env:RUNNER_TEMP/pg.jar" "$env:RUNNER_TEMP/pg.zip"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/pgjar" | Out-Null
          tar -xf "$env:RUNNER_TEMP/pg.zip" -C "$env:RUNNER_TEMP/pgjar"
          $txz = (Get-ChildItem "$env:RUNNER_TEMP/pgjar" -Filter *.txz | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "$env:BUNDLE/pgsql" | Out-Null
          python -c "import tarfile,sys; tarfile.open(sys.argv[1],'r:xz').extractall(sys.argv[2])" $txz "$env:BUNDLE/pgsql"
          Get-ChildItem "$env:BUNDLE/pgsql" | Select-Object -First 6 Name

      - name: Generate launcher files and zip
        shell: pwsh
        run: |
          python tools/make_bundle.py $env:BUNDLE --public
          python tools/make_zip.py $env:BUNDLE $env:ZIP
          Get-Item $env:ZIP | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Verify bundle (complete + no real keys)
        run: python tools/verify_bundle.py ${{ env.ZIP }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teldrive-2-win64
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Diagnose token and repo
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh --version
          gh api "repos/$env:GH_REPO" --jq '{private, permissions}' 2>&1
          gh auth status 2>&1

      - name: Publish release asset
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = $env:GITHUB_REF_NAME
          $notes = "CI 在 windows-latest 上从源码构建的 Windows 一键运行包。解压后双击 teldrive.exe（包里唯一的入口，没有 .bat 脚本）：首次启动会自动生成随机密钥、初始化内置 PostgreSQL，并在端口就绪后打开浏览器；退出时会自己停掉内置数据库。详见仓库 README。"
          Write-Host "publishing $tag (asset $env:ZIP)"
          gh release view $tag --json tagName --jq .tagName 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "teldrive 一键运行包 $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { Write-Error "gh release create failed ($LASTEXITCODE)"; exit 1 }
          }
          gh release upload $tag $env:ZIP --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "gh release upload failed ($LASTEXITCODE)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
